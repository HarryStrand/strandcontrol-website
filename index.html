<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="home.title">StrandControl</title>
  <meta name="description" data-i18n-content="home.description" content="StrandControl makes software you use with people in the same room. Home of Dartopia, a dart scoring app for iPhone, iPad, and Apple TV.">
  <link rel="canonical" href="https://strandcontrol.com/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="theme-studio">
  <a class="skip" href="#content" data-i18n="nav.skip">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-current="page" aria-label="StrandControl"><img src="/assets/strandcontrol-logo.png" width="800" height="253" alt="StrandControl"></a>
      <nav aria-label="Primary" data-i18n-aria="nav.primary">
        <a href="/dartopia">Dartopia</a>
        <a href="/privacy" data-i18n="nav.privacy">Privacy</a>
        <a href="/support" data-i18n="nav.support">Support</a>
      </nav>
    </div>
  </header>

  <main id="content">
    <section class="section" aria-labelledby="apps-heading">
      <div class="wrap">
        <h2 id="apps-heading" data-i18n="home.apps">Apps</h2>
        <a class="app-card" href="/dartopia">
          <img src="/assets/dartopia-icon.png" width="88" height="88" alt="">
          <div>
            <h2>Dartopia</h2>
            <p data-i18n="home.card">Dart scoring for Cricket, 301, and more. iPhone, iPad, and Apple TV. Plays on the device next to the board.</p>
          </div>
        </a>
        <p class="store-badge">
          <a href="https://apps.apple.com/app/dartopia/id6813150615">
            <img src="/assets/app-store/black/en.svg" width="120" height="40" alt="Download on the App Store" data-i18n-alt="dartopia.badge" data-store-badge="black">
          </a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <small>© 2026 StrandControl, LLC</small>
      <nav aria-label="Footer" data-i18n-aria="nav.footer">
        <a href="/dartopia">Dartopia</a>
        <a href="/privacy" data-i18n="nav.privacy">Privacy</a>
        <a href="/support" data-i18n="nav.support">Support</a>
        <a href="/impressum">Impressum</a>
      </nav>
    </div>
  </footer>
</body>
</html>
